<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Визитка · Руссков Игорь Валерьевич</title>
<style>
  :root{
    --bg1:#0d1218; --bg2:#141c26; --card:#161e28; --card2:#1f2933;
    --accent:#3a86ff; --accent2:#4cc9f0; --text:#e8edf2; --muted:#8a98a6;
    --line:rgba(255,255,255,.07); --star:#ffc24b;
  }
  [data-theme="light"]{
    --bg1:#eef2f7; --bg2:#dde6f0; --card:#ffffff; --card2:#f1f5fa;
    --accent:#2563eb; --accent2:#0ea5e9; --text:#1e293b; --muted:#64748b;
    --line:rgba(0,0,0,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);
    min-height:100vh;display:flex;justify-content:center;padding:18px 12px;transition:.3s}
  .card{width:100%;max-width:430px;background:var(--card);border:1px solid var(--line);
    border-radius:24px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4)}

  .hero{position:relative;padding:24px 20px 16px;text-align:center;
    background:radial-gradient(110% 100% at 50% 0%,rgba(58,134,255,.20),transparent 60%)}
  .theme-btn{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;
    border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:1rem;
    cursor:pointer;transition:.2s;display:grid;place-items:center}
  .theme-btn:hover{border-color:var(--accent);transform:scale(1.08)}
  .ava-wrap{position:relative;display:inline-block}
  .avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;
    border:3px solid var(--accent);box-shadow:0 6px 18px rgba(58,134,255,.35);background:#2a333d}
  .status{position:absolute;bottom:6px;right:6px;width:18px;height:18px;border-radius:50%;
    background:#2ecc71;border:3px solid var(--card)}
  .status::after{content:"";position:absolute;inset:-3px;border-radius:50%;
    background:#2ecc71;opacity:.5;animation:pulse 2s infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.2);opacity:0}}
  .name{font-size:1.18rem;font-weight:700;margin-top:12px}
  .role{color:var(--accent2);font-weight:600;margin-top:3px;font-size:.82rem}
  .online{display:inline-flex;align-items:center;gap:5px;color:#2ecc71;font-size:.72rem;
    font-weight:600;margin-top:6px}
  .online i{width:7px;height:7px;border-radius:50%;background:#2ecc71;display:inline-block}
  .tagline{color:var(--muted);margin-top:8px;line-height:1.45;font-size:.82rem;max-width:330px;margin-inline:auto}

  /* СТАТИСТИКА */
  .stats{display:flex;gap:8px;padding:14px 20px 4px}
  .stat{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:14px;
    padding:10px 6px;text-align:center}
  .stat b{display:block;font-size:1.05rem;color:var(--accent2)}
  .stat span{font-size:.66rem;color:var(--muted);line-height:1.2;display:block;margin-top:2px}

  .quick{display:flex;justify-content:center;gap:12px;padding:16px 20px 4px;flex-wrap:wrap}
  .qbtn{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;
    background:var(--card2);border:1px solid var(--line);text-decoration:none;
    color:var(--accent2);transition:.2s;position:relative}
  .qbtn:hover{border-color:var(--accent);transform:translateY(-3px);background:var(--accent);color:#fff}
  .qbtn svg{width:22px;height:22px}
  .qbtn span{position:absolute;bottom:-17px;font-size:.62rem;color:var(--muted);white-space:nowrap}

  .actions{display:flex;gap:10px;padding:24px 20px 14px}
  .actions button{flex:1;border:none;border-radius:14px;padding:12px;font-weight:600;
    font-size:.85rem;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
  .btn-primary:hover{filter:brightness(1.1);transform:translateY(-2px)}
  .btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)!important}
  .btn-ghost:hover{border-color:var(--accent)!important;transform:translateY(-2px)}

  .acc{border-top:1px solid var(--line)}
  .acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;
    background:none;border:none;color:var(--text);cursor:pointer;padding:15px 20px;
    font-size:.95rem;font-weight:700;font-family:inherit}
  .acc-head .left{display:flex;align-items:center;gap:9px}
  .acc-head .bar{width:4px;height:16px;border-radius:3px;background:linear-gradient(var(--accent),var(--accent2))}
  .acc-head .badge{margin-left:auto;margin-right:10px;font-size:.66rem;color:var(--muted);
    background:var(--card2);padding:2px 8px;border-radius:20px;font-weight:600}
  .chev{transition:.3s;color:var(--muted)}
  .acc.open .chev{transform:rotate(180deg);color:var(--accent2)}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
  .acc-inner{padding:0 20px 16px}

  .service{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:8px}
  .service:last-child{margin-bottom:0}
  .service h4{font-size:.86rem;margin-bottom:3px}
  .service p{color:var(--muted);font-size:.76rem;line-height:1.4}

  .price{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .price:last-child{border-bottom:none}
  .price .pname{font-weight:600;font-size:.82rem}
  .price .pnote{color:var(--muted);font-size:.7rem;margin-top:2px}
  .price .pval{white-space:nowrap;font-weight:700;color:var(--accent2);background:rgba(76,201,240,.14);padding:4px 9px;border-radius:9px;font-size:.76rem}

  /* ОТЗЫВЫ-карточки */
  .testi{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px}
  .testi .top{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .testi .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;display:grid;place-items:center;font-size:.78rem;font-weight:700}
  .testi .who{font-size:.8rem;font-weight:600}
  .testi .stars{color:var(--star);font-size:.72rem;letter-spacing:1px}
  .testi p{color:var(--muted);font-size:.76rem;line-height:1.45}
  .review-link{display:flex;justify-content:space-between;align-items:center;text-decoration:none;
    color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:11px;
    padding:10px 12px;margin-bottom:8px;transition:.2s}
  .review-link:last-child{margin-bottom:0}
  .review-link:hover{border-color:var(--accent);transform:translateX(3px)}
  .review-link .rl{font-weight:600;font-size:.82rem}
  .review-link .rd{color:var(--muted);font-size:.7rem}
  .review-link .arrow{color:var(--accent2);font-size:1rem}
  .rev-sub{font-size:.72rem;color:var(--muted);margin:12px 0 8px;font-weight:600}

  footer{padding:16px 20px 22px;text-align:center;color:var(--muted);font-size:.72rem;
    border-top:1px solid var(--line);line-height:1.5}
  footer .trust{display:inline-flex;align-items:center;gap:5px;color:var(--accent2);font-weight:600;margin-bottom:4px}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;
    justify-content:center;padding:20px;z-index:50;backdrop-filter:blur(3px)}
  .modal.open{display:flex}
  .modal-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;text-align:center;max-width:300px;width:100%}
  .modal-box h3{margin-bottom:5px;font-size:1rem}
  .modal-box p{color:var(--muted);font-size:.78rem;margin-bottom:14px}
  .modal-box img{width:200px;height:200px;border-radius:12px;background:#fff;padding:8px}
  .modal-close{margin-top:16px;width:100%;border:none;border-radius:12px;padding:11px;background:var(--card2);
    color:var(--text);border:1px solid var(--line)!important;cursor:pointer;font-weight:600;transition:.2s}
  .modal-close:hover{border-color:var(--accent)!important}
</style>
</head>
<body>
  <main class="card" id="card"></main>
  <div class="modal" id="qrModal">
    <div class="modal-box">
      <h3>Сканируйте QR</h3><p>Камера телефона добавит контакт</p>
      <img id="qrImg" alt="QR"><button class="modal-close" onclick="toggleQR(false)">Закрыть</button>
    </div>
  </div>

<script>
const data = {
  name:"Руссков Игорь Валерьевич",
  role:"Риэлтор, личный подбор недвижимости",
  tagline:"Помогаю купить, продать или снять жильё без суеты: от подбора до ключей в руках.",
  photoUrl:"./avatar.png", phone:"+79501333808", email:"agent@example.com", org:"Личный подбор недвижимости",
  online:true,
  stats:[
    {value:"8 лет",label:"опыта"},
    {value:"150+",label:"сделок"},
    {value:"4.9 ★",label:"рейтинг"}
  ],
  services:[
    {title:"Подбор под запрос",text:"Бюджет, район, сроки — показываю только релевантные варианты."},
    {title:"Сопровождение сделки",text:"Просмотры, переговоры, проверка документов."},
    {title:"Ипотека и альтернатива",text:"Помощь по одобрению и сценариям продажа+покупка."},
    {title:"Продажа объекта",text:"Презентация, показы, выгодная сделка."}
  ],
  prices:[
    {name:"Первичная консультация",price:"бесплатно",note:"до 30 минут"},
    {name:"Подбор объекта",price:"от 30 000 ₽",note:"в зачёт комиссии"},
    {name:"Сопровождение под ключ",price:"от 2%",note:"от суммы договора"},
    {name:"Экспресс-оценка",price:"от 5 000 ₽",note:"по объекту"}
  ],
  testimonials:[
    {name:"Анна К.",rating:5,text:"Игорь помог купить квартиру за 3 недели. Всё чётко, без нервов, на связи 24/7."},
    {name:"Дмитрий П.",rating:5,text:"Продали дом дороже, чем ожидали. Грамотные переговоры, рекомендую!"}
  ],
  reviewLinks:[
    {label:"Яндекс Карты",description:"Оставить отзыв",href:"https://yandex.ru/maps/"},
    {label:"Google",description:"Отзыв в Google",href:"https://www.google.com/maps"},
    {label:"2ГИС",description:"Отзыв в профиле",href:"https://2gis.ru/"}
  ],
  contacts:[
    {label:"Звонок",type:"phone",href:"tel:+79501333808"},
    {label:"WhatsApp",type:"wa",href:"https://wa.me/79001234567"},
    {label:"Telegram",type:"tg",href:"https://t.me/realestate_irkutsk"},
    {label:"Email",type:"mail",href:"mailto:agent@example.com"}
  ],
  reviewIntro:"Буду благодарен за пару строк о работе — это помогает другим сделать выбор.",
  footerNote:"Визитка для клиентов · условия уточняйте при звонке"
};

const icons = {
  phone:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11 11 0 0 0 3.5.56 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11 11 0 0 0 .56 3.5 1 1 0 0 1-.25 1L6.6 10.8z"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.4A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1 1 12 20zm4.5-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5c.1-.2.1-.3 0-.5l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.4-.3z"/></svg>',
  tg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.7 19c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-.9.5l.3-4.6 8.4-7.6c.4-.3-.1-.5-.6-.2L6.5 13.2l-4.4-1.4c-1-.3-1-1 .2-1.4l17.2-6.6c.8-.3 1.5.2 1.4 1.5z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7L4.5 7H19.5L12 12zm0 2.2L4 8.6V18h16V8.6l-8 5.6z"/></svg>'
};

function buildVCard(d){
  const p=d.name.split(" ");
  return ["BEGIN:VCARD","VERSION:3.0",`N:${p[0]||""};${p[1]||""};${p[2]||""};;`,`FN:${d.name}`,
    `ORG:${d.org||""}`,`TITLE:${d.role}`,`TEL;TYPE=CELL:${d.phone}`,`EMAIL:${d.email}`,`NOTE:${d.tagline}`,"END:VCARD"].join("\n");
}
function saveContact(){
  const url=URL.createObjectURL(new Blob([buildVCard(data)],{type:"text/vcard"}));
  const a=document.createElement("a");a.href=url;a.download=data.name.replace(/\s+/g,"_")+".vcf";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
function toggleQR(o){
  const m=document.getElementById("qrModal");
  if(o){document.getElementById("qrImg").src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data="+encodeURIComponent(buildVCard(data));m.classList.add("open");}
  else m.classList.remove("open");
}
function toggleTheme(){
  const n=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
  document.documentElement.setAttribute("data-theme",n);localStorage.setItem("vcard-theme",n);themeIcon();
}
function themeIcon(){
  const b=document.getElementById("themeBtn");
  if(b)b.textContent=document.documentElement.getAttribute("data-theme")==="light"?"🌙":"☀️";
}
function toggleAcc(el){
  const acc=el.closest(".acc"),was=acc.classList.contains("open");
  document.querySelectorAll(".acc.open").forEach(a=>{a.classList.remove("open");a.querySelector(".acc-body").style.maxHeight=null;});
  if(!was){acc.classList.add("open");const b=acc.querySelector(".acc-body");b.style.maxHeight=b.scrollHeight+"px";}
}

function render(d){
  const stats=d.stats.map(s=>`<div class="stat"><b>${s.value}</b><span>${s.label}</span></div>`).join("");
  const quick=d.contacts.map(c=>`<a class="qbtn" href="${c.href}" ${c.href.startsWith('http')?'target="_blank" rel="noopener"':''} title="${c.label}">${icons[c.type]}<span>${c.label}</span></a>`).join("");
  const services=d.services.map(s=>`<div class="service"><h4>${s.title}</h4><p>${s.text}</p></div>`).join("");
  const prices=d.prices.map(p=>`<div class="price"><div><div class="pname">${p.name}</div><div class="pnote">${p.note}</div></div><div class="pval">${p.price}</div></div>`).join("");
  const testi=d.testimonials.map(t=>`<div class="testi"><div class="top"><div class="av">${t.name[0]}</div><div><div class="who">${t.name}</div><div class="stars">${"★".repeat(t.rating)}</div></div></div><p>${t.text}</p></div>`).join("");
  const links=d.reviewLinks.map(r=>`<a class="review-link" href="${r.href}" target="_blank" rel="noopener"><div><div class="rl">${r.label}</div><div class="rd">${r.description}</div></div><span class="arrow">↗</span></a>`).join("");
  const chev='<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>';
  const acc=(t,b,inner,open=false)=>`<div class="acc${open?' open':''}"><button class="acc-head" onclick="toggleAcc(this)"><span class="left"><span class="bar"></span>${t}</span>${b?`<span class="badge">${b}</span>`:''}${chev}</button><div class="acc-body"><div class="acc-inner">${inner}</div></div></div>`;

  return `
    <div class="hero">
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
      <div class="ava-wrap">
        <img class="avatar" src="${d.photoUrl}" alt="${d.name}"
          onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(d.name)}&background=3a86ff&color=fff&size=200'">
        ${d.online?'<span class="status"></span>':''}
      </div>
      <h1 class="name">${d.name}</h1>
      <div class="role">${d.role}</div>
      ${d.online?'<div class="online"><i></i> На связи · отвечаю быстро</div>':''}
      <p class="tagline">${d.tagline}</p>
    </div>

    <div class="stats">${stats}</div>
    <div class="quick">${quick}</div>
    <div class="actions">
      <button class="btn-primary" onclick="saveContact()">💾 Контакт</button>
      <button class="btn-ghost" onclick="toggleQR(true)">📱 QR-код</button>
    </div>

    ${acc("Услуги", d.services.length, services)}
    ${acc("Стоимость", d.prices.length, prices)}
    ${acc("Отзывы", d.testimonials.length, testi + `<p class="rev-sub">Оставить свой отзыв:</p>` + links)}

    <footer>
      <div class="trust">✓ Работаю по договору</div><br>
      ${d.footerNote}<br>© ${new Date().getFullYear()} ${d.name}
    </footer>`;
}

document.documentElement.setAttribute("data-theme",localStorage.getItem("vcard-theme")||"dark");
document.getElementById("card").innerHTML=render(data);
themeIcon();
document.getElementById("qrModal").addEventListener("click",e=>{if(e.target.id==="qrModal")toggleQR(false);});
</script>
</body>
</html>
